version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - postgres
      - redis

  arkchain:
    build:
      context: .
      dockerfile: arkchain/Dockerfile
    ports:
      - "${ARKCHAIN_PORT:-8100}:8100"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-svp}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-svp}"
      POSTGRES_DB: "${POSTGRES_DB:-svp}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"

